name: Python CI - Pytest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Install from your backend requirements if it exists
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          
          # 2. Ensure testing and core math libraries are installed
          pip install pytest httpx numpy pandas scikit-learn scipy fastapi

      - name: Run unit tests
        env:
          # CRITICAL FIX: Sets the root directory as the Python path
          # This allows your tests to import modules like 'from backend.main import app'
          PYTHONPATH: .
        run: |
          # Explicitly target the backend/tests directory
          pytest backend/tests -v